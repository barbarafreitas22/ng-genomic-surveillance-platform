services:
  ng-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: ng-genomic-platform:latest
    container_name: ng-platform
    ports:
      - "${NG_PORT:-8501}:8501"
    volumes:
      - ./data/phylogeny:/workspace/data/phylogeny
      - ng_projects:/workspace/app/projects
      - ng_phylo_runs:/workspace/backend/phylogeny/runs
      - ng_ska_cache:/workspace/data/phylogeny/ska_cache
      - ng_results:/workspace/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${NG_PLATFORM_MEMORY:-2g}
          cpus: '${NG_PLATFORM_CPUS:-2}'

  ng-worker:
    image: ng-genomic-platform:latest
    container_name: ng-worker
    entrypoint: ["python", "-m", "backend.worker"]
    working_dir: /workspace
    volumes:
      - ./data/phylogeny:/workspace/data/phylogeny
      - ng_projects:/workspace/app/projects
      - ng_phylo_runs:/workspace/backend/phylogeny/runs
      - ng_ska_cache:/workspace/data/phylogeny/ska_cache
      - ng_results:/workspace/results
    environment:
      - WORKER_POLL_INTERVAL=${WORKER_POLL_INTERVAL:-2}
    depends_on:
      ng-platform:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${NG_WORKER_MEMORY:-4g}
          cpus: '${NG_WORKER_CPUS:-4}'

volumes:
  ng_projects:
  ng_phylo_runs:
  ng_ska_cache:
  ng_results:
