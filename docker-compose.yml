services:
  ng-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: ng-genomic-platform:latest
    container_name: ng-platform
    ports:
      - "8501:8501"
    volumes:
      - ./app:/workspace/app
      - ./backend:/workspace/backend
      - ./data/phylogeny:/workspace/data/phylogeny
      - ng_projects:/workspace/app/projects
      - ng_phylo_runs:/workspace/backend/phylogeny/runs
      - ng_ska_cache:/workspace/data/phylogeny/ska_cache
      - ng_results:/workspace/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ng-worker:
    image: ng-genomic-platform:latest
    entrypoint: ["python", "-m", "backend.worker"]
    working_dir: /workspace
    volumes:
      - ./backend:/workspace/backend
      - ./data/phylogeny:/workspace/data/phylogeny
      - ng_projects:/workspace/app/projects
      - ng_phylo_runs:/workspace/backend/phylogeny/runs
      - ng_ska_cache:/workspace/data/phylogeny/ska_cache
      - ng_results:/workspace/results
    environment:
      - WORKER_POLL_INTERVAL=2
      - WORKER_THREADS=1
    depends_on:
      ng-platform:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 5g

volumes:
  ng_projects:
  ng_phylo_runs:
  ng_ska_cache:
  ng_results:
